version: '3'

tasks:
  default:
    desc: Run default tasks.
    cmds:
      - task: ops
      - task: build
  ops:
    desc: Run scripts in scripts/ops
    cmds:
      - sh scripts/ops/go-bugcheck.sh
      - sh scripts/ops/go-seccheck.sh
  lint:
    desc: Run golangci-lint.
    cmds:
      - golangci-lint run ./...
  test:
    desc: Run go tests via script.
    cmds:
      - sh scripts/test.sh
  build:
    desc: Build all packages into dist/.
    cmds:
      - sh scripts/build.sh
  smoke:
    desc: End-to-end smoke with the generator CLI.
    cmds:
      - sh scripts/smoke.sh
  standalone:
    desc: Build and run each library in a throwaway module.
    cmds:
      - sh scripts/standalone.sh
  upstream:
    desc: Check forked upstreams for newer releases and advisories.
    cmds:
      - sh scripts/upstream.sh
  man:
    desc: Generate man pages into dist/man.
    cmds:
      - go run ./cmd/terminull man --dir dist/man
  build-site:
    cmds:
      - mkdocs build
  check-links:
    cmds:
      - cmd: lychee .
  ci-local:
    desc: Runs all jobs in .ci/jobs
    cmds:
      - echo RUNNING JOBS.
      - |
        for f in .ci/jobs/*.sh; do
          if [ -f "$f" ] && [ "$(basename "$f")" != "example.sh" ]; then
            echo "Running CI job: $f"
            sh "$f"
          fi
        done
      - echo DONE.
  cliff:
    desc: Run git cliff
    silent: true
    env:
      RUST_LOG: off
    cmds:
      - git-cliff --unreleased --strip all
  scan:
    desc: Run other ops tools on the repo.
    cmds:
      - cmd: opengrep scan
      - cmd: osv-scanner scan .
      - cmd: gitleaks git . --no-banner
      - cmd: scorecard --local . --format json | gron
