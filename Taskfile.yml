version: '3'

tasks:
  default:
    desc: Run default tasks.
    cmds:
      - task: ops
      - task: build
  ops:
    desc: Run the ops script.
    cmds:
      - sh scripts/ops/ops.sh
  lint:
    desc: Run the lint script.
    cmds:
      - sh scripts/ops/lint.sh
  test:
    desc: Run the test script.
    cmds:
      - sh scripts/test.sh
  build:
    desc: Run the build script.
    cmds:
      - sh scripts/build.sh
  smoke:
    desc: Run the smoke test script.
    cmds:
      - sh scripts/smoke.sh
  other:
    desc: Run other tasks.
    cmds:
      - sh scripts/task-other.sh
  build-site:
    desc: Build the project site via mkdocs.
    cmds:
      - mkdocs build
  check-links:
    desc: Verify links.
    cmds:
      - cmd: lychee .
  ci-local:
    desc: Run all jobs in .ci/jobs
    cmds:
      - echo RUNNING JOBS.
      - |
        for f in .ci/jobs/*.sh; do
          if [ -f "$f" ] && [ "$(basename "$f")" != "example.sh" ]; then
            echo "Running CI job: $f"
            sh "$f"
          fi
        done
      - echo DONE.
  cliff:
    desc: Run git cliff.
    silent: true
    env:
      RUST_LOG: off
    cmds:
      - git-cliff --unreleased --strip all
  scan:
    desc: Run other ops tools on the repo.
    cmds:
      - cmd: opengrep scan
      - cmd: osv-scanner scan .
      - cmd: gitleaks git . --no-banner
      - cmd: scorecard --local . --format json | gron
