version: '3'

tasks:
  default:
    desc: Run default tasks.
    cmds:
      - task: ops
      - task: build
  ops:
    desc: Run scripts in scripts/ops
    cmds:
      - sh scripts/ops/go-bugcheck.sh
      - sh scripts/ops/go-seccheck.sh
  lint:
    desc: Run golangci-lint.
    cmds:
      - golangci-lint run ./...
  test:
    desc: Run go tests via script.
    cmds:
      - sh scripts/test.sh
  build:
    desc: Build all packages into dist/.
    cmds:
      - sh scripts/build.sh
  smoke:
    desc: End-to-end smoke with the generator CLI.
    cmds:
      - sh scripts/smoke.sh
  standalone:
    desc: Build and run each library in a throwaway module.
    cmds:
      - sh scripts/standalone.sh
  build-site:
    cmds:
      - mkdocs build
  check-links:
    cmds:
      - cmd: lychee .
  cliff:
    desc: Run git cliff
    silent: true
    env:
      RUST_LOG: off
    cmds:
      - git-cliff --unreleased --strip all
  scan:
    desc: Run other ops tools on the repo.
    cmds:
      - cmd: opengrep scan
      - cmd: osv-scanner scan .
      - cmd: gitleaks git . --no-banner
      - cmd: scorecard --local . --format json | gron
