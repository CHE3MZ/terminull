version: '3'

tasks:
  default:
    desc: Run bugcheck + seccheck locally (any POSIX sh, e.g. Git Bash or scoop sh).
    cmds:
      - task: ops
        ignore_error: true
      - task: build
  ops:
    desc: Run scripts in scripts/ops
    cmds:
      - sh scripts/ops/go-bugcheck.sh
      - sh scripts/ops/go-seccheck.sh
  lint:
    desc: Run golangci-lint.
    cmds:
      - golangci-lint run ./...
  test:
    desc: Run go tests via script.
    cmds:
      - sh scripts/test.sh
  build:
    desc: Build all packages into dist/.
    cmds:
      - sh scripts/build.sh
  smoke:
    desc: End-to-end smoke with the generator CLI.
    cmds:
      - sh scripts/smoke.sh
  demo:
    desc: Render one table in every termtable style.
    cmds:
      - go run ./examples/termtable
  scan:
    desc: Run other ops tools on the repo.
    cmds:
      - cmd: opengrep scan
      - cmd: osv-scanner scan .