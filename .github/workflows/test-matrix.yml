name: Test matrix

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Go test
        shell: bash
        run: |
          if [ -z "$(go list ./... 2>/dev/null)" ]; then
            echo "no Go packages yet, skipping"
            echo "no Go packages yet" > logs-test.txt
            exit 0
          fi
          go test -v ./... 2>&1 | tee logs-test.txt
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: logs-test.txt
