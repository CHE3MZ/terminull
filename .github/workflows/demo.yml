name: Demo

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  demo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Demo smoke (full non-interactive flow per OS)
        shell: bash
        run: |
          mkdir -p dist
          go build -o dist/demo ./cmd/demo
          BIN=./dist/demo
          "$BIN" --help | tee "demo-${{ matrix.os }}.txt"
          "$BIN" --version | tee -a "demo-${{ matrix.os }}.txt"
          "$BIN" deploy --help | tee -a "demo-${{ matrix.os }}.txt"
          "$BIN" deploy --env prod --yes --output table | tee -a "demo-${{ matrix.os }}.txt"
          "$BIN" deploy --env staging --yes --output json | tee -a "demo-${{ matrix.os }}.txt"
          "$BIN" status --output yaml | tee -a "demo-${{ matrix.os }}.txt"
      - name: Upload demo output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-output-${{ matrix.os }}
          path: demo-*.txt
