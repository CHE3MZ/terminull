name: Demo

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  demo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Demo smoke (skips cleanly until cmd/demo lands)
        shell: bash
        run: |
          mkdir -p dist
          if [ ! -d cmd/demo ]; then
            echo "no cmd/demo yet, skipping"
            echo "demo skipped (no cmd/demo)" > "demo-${{ matrix.os }}.txt"
            exit 0
          fi
          go build -o dist/demo ./cmd/demo
          ./dist/demo --help | tee "demo-${{ matrix.os }}.txt" || dist/demo.exe --help | tee "demo-${{ matrix.os }}.txt"
          ./dist/demo --version | tee -a "demo-${{ matrix.os }}.txt" || dist/demo.exe --version | tee -a "demo-${{ matrix.os }}.txt" || true
      - name: Upload demo output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-output-${{ matrix.os }}
          path: demo-*.txt
