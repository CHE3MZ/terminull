name: Dogfood

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dogfood:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Scaffold, build, and run a generated project
        shell: bash
        run: |
          set -euo pipefail
          go build -o dist/terminull ./cmd/terminull
          WORK="$PWD/dist/dogfood-app"
          rm -rf "$WORK"
          ./dist/terminull new dogfood --dir "$WORK" --module example.com/dogfood --replace "$PWD" | tee "dogfood-${{ matrix.os }}.txt"
          cd "$WORK"
          go build ./...
          go build -o dogfood ./cmd/dogfood
          ./dogfood --help | tee -a "$GITHUB_WORKSPACE/dogfood-${{ matrix.os }}.txt"
          ./dogfood hello --name dogfood | tee -a "$GITHUB_WORKSPACE/dogfood-${{ matrix.os }}.txt"
          ./dogfood status --output json | tee -a "$GITHUB_WORKSPACE/dogfood-${{ matrix.os }}.txt"
      - name: Upload dogfood output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dogfood-output-${{ matrix.os }}
          path: dogfood-*.txt
