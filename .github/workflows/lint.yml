name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  golangci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
  sec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Install tools
        shell: bash
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest && go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Sec check
        shell: bash
        run: bash scripts/ops/go-seccheck.sh
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-logs
          path: logs/
