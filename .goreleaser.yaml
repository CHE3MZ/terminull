version: 2

project_name: terminull

before:
  hooks:
    - go mod tidy

builds:
  - id: terminull
    main: ./cmd/terminull
    binary: terminull
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/CHE3MZ/terminull/v2/termcore.Version={{.Version}}
      - -X github.com/CHE3MZ/terminull/v2/termcore.Commit={{.Commit}}

archives:
  - id: terminull
    ids:
      - terminull
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

homebrew_casks:
  - name: terminull
    repository:
      owner: CHE3MZ
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/CHE3MZ/terminull
    description: Scaffold batteries-included Go CLI apps.
    license: MIT
    binaries:
      - terminull
    skip_upload: auto
scoops:
  - name: terminull
    repository:
      owner: CHE3MZ
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    directory: bucket
    homepage: https://github.com/CHE3MZ/terminull
    description: Scaffold batteries-included Go CLI apps.
    license: MIT
    skip_upload: auto

chocolateys:
  - name: terminull
    owners: CHE3MZ
    title: terminull
    authors: CHE3MZ
    project_url: https://github.com/CHE3MZ/terminull
    license_url: https://github.com/CHE3MZ/terminull/blob/main/LICENSE
    description: Scaffold batteries-included Go CLI apps.
    summary: Go CLI scaffolding with prompting, logging, and output.
    tags: cli terminal go
    package_source_url: https://github.com/CHE3MZ/terminull
    skip_publish: true
